[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ta-forecasting"
version = "0.1.0"
description = "Perbandingan ETS, ARIMA, dan TFT untuk peramalan indeks biaya energi"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Author"},
]

dependencies = [
    # Data
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "pyarrow>=15,<20",

    # Statistical models
    "statsmodels>=0.14,<1",

    # Deep learning — pinned for macOS x86_64 compatibility.
    # torch 2.2.x is the last line available for macOS x86_64 and was built against
    # NumPy 1.x, so numpy is capped below 2. lightning and pytorch-lightning must match.
    "torch>=2.2,<2.3",
    "lightning>=2.2,<2.5",
    "pytorch-lightning>=2.2,<2.5",
    "pytorch-forecasting>=1.1,<2",

    # Config & validation
    "pyyaml>=6,<7",
    "pydantic>=2,<3",

    # Visualization
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",

    # Dashboard (Phase 7b, local / internal network only)
    "streamlit>=1.66,<2",
    "plotly>=7.1,<8",

    # CLI
    "typer[all]>=0.12,<1",

    # Utilities
    "scikit-learn>=1.4,<2",
    "scipy>=1.12,<2",
    "numpy>=1.26,<2",
    "joblib>=1.3,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
]

[project.scripts]
ta-forecasting = "ta_forecasting.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
