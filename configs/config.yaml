# =============================================================================
# Central configuration — all parameters defined here, no magic numbers in code
# =============================================================================

project:
  name: "ta-forecasting"
  seed: 42
  last_actual_quarter: "2026Q1"

data:
  raw_dir: "data/raw"
  raw_file: "Market_Segment_Cost_Models_-_Q2_2026.xlsx"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  db_dir: "data/db"

validation:
  strategy: "temporal_split"
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

# Phase 3 — data preparation (target selection, features, TFT dataset windows)
prep:
  source_dataset: "Data"            # interim parquet stem holding the time series
  lookup_dataset: "ID_lookup"       # interim parquet stem holding series metadata
  target_series_type: "Cost Index"  # only series of this type are forecast
  columns:
    date: "Date"
    series_id: "ID"
    value: "Index value ($)"
    series_type: "Series type"
    lookup_id: "Series ID"
    concept: "Concept"
    region: "Region"
  target_column: "target"           # name of the value column in the processed panel
  quarter_period: 4                 # seasonal period used for sin/cos encoding
  max_encoder_length: 16
  min_encoder_length: 16            # = max: no shortened-encoder windows in any split
  max_prediction_length: 4
  normalizer_method: "standard"     # per-ID mean/std, fitted on train rows only
  panel_file: "panel.parquet"
  scaler_file: "scaler.json"
  summary_file: "split_summary.json"

metrics:
  primary: "mape"
  secondary:
    - "rmse"
    - "mae"
    - "smape"

# Phase 5 — rolling-origin evaluation. Origins run from the first quarter of each split to
# the last quarter whose full horizon (prep.max_prediction_length) still lies in that split.
evaluation:
  splits: ["val", "test"]
  main_models: ["ets", "arima", "tft"]
  baselines: ["naive", "seasonal_naive"]  # reference only; [] to skip
  sensitivity_models: ["ets", "arima"]    # re-run with rolling.refit_statistical = true
  run_sensitivity: true
  n_jobs: 4                     # parallel series chunks for ETS / ARIMA (results unchanged)
  percentiles: [10, 25, 50, 75, 90]
  dm_split: "test"
  dm_loss: "ape"                # ape | ae | se: loss differential of the Diebold-Mariano test
  dm_alpha: 0.05
  dm_fdr_method: "fdr_bh"       # multiple-testing correction over series (statsmodels name)
  output_dir: "outputs/eval"
  predictions_file: "predictions.parquet"
  per_series_file: "per_series_metrics.csv"
  report_prefix: "phase5"

# Phase 4 — rolling-origin forecasting protocol shared by all models.
# Horizon = prep.max_prediction_length. Order / configuration of ETS and ARIMA is always
# chosen on train only. refit_statistical=false: at each origin ETS/ARIMA keep their train
# parameters and only update their state with the history (like the TFT, whose weights are
# fixed after training). true: parameters are re-estimated on the history at every origin.
rolling:
  refit_statistical: false

ets:
  seasonal_periods: 4       # quarterly data
  trend: "add"
  seasonal: "add"
  damped_trend: true
  initialization_method: "estimated"
  fallback_seasonal: null   # used only if the primary fit raises or gives non-finite output

arima:
  # Order search per series on train only: D by seasonal strength, then d by KPSS on the
  # seasonally differenced series, then an exhaustive (p, q, P, Q) grid ranked by AIC.
  max_p: 3
  max_d: 2
  max_q: 3
  max_P: 1
  max_D: 1
  max_Q: 1
  seasonal_period: 4
  kpss_alpha: 0.05
  kpss_regression: "c"
  kpss_nlags: "auto"
  seasonal_strength_threshold: 0.64   # Wang, Smith & Hyndman (2006); forecast::nsdiffs
  information_criterion: "aic"
  constant_max_total_diff: 1          # constant/drift only when d + D <= this
  fit_method: "lbfgs"
  maxiter: 200
  enforce_stationarity: true
  enforce_invertibility: true
  n_jobs: 4                           # parallel series in the order search (joblib)

tft:
  hidden_size: 64
  attention_head_size: 4
  dropout: 0.1
  hidden_continuous_size: 16
  max_epochs: 100
  learning_rate: 0.001
  batch_size: 64
  gradient_clip_val: 0.1
  early_stop_patience: 10
  reduce_lr_patience: 5
  quantiles: [0.02, 0.1, 0.25, 0.5, 0.75, 0.9, 0.98]
  point_quantile: 0.5       # median is the point forecast
  monitor: "val_loss"
  accelerator: "auto"       # auto -> cuda / mps if available, else cpu
  devices: 1
  num_threads: 4            # torch intra-op threads on CPU
  num_workers: 0
  deterministic: true
  log_every_n_steps: 10

# Phase 6 — final report. Reads only the Phase 5 aggregate CSVs, training_summary.json,
# arima_orders.json (counted, never listed) and split_summary.json. No model is re-run.
report:
  output_file: "FINAL_REPORT.md"        # written to output.reports_dir
  figures_dir: "outputs/report"
  split: "test"                         # split of the headline comparison
  main_mode: "main"
  sensitivity_mode: "refit"
  model_order: ["ets", "arima", "tft", "naive", "seasonal_naive"]
  model_labels:
    ets: "ETS"
    arima: "ARIMA"
    tft: "TFT"
    naive: "Naive"
    seasonal_naive: "Seasonal naive"
  split_labels:
    train: "Latih"
    val: "Validasi"
    test: "Uji"
  metric_labels:
    mape: "MAPE (%)"
    rmse: "RMSE"
    mae: "MAE"
    smape: "SMAPE (%)"
  decimals: 2                           # metric values in tables and text
  p_value_decimals: 4
  decimal_separator: ","                # Indonesian convention
  thousands_separator: "."
  forbidden_columns: ["ID", "actual", "prediction", "time_idx", "origin"]
  figure:
    dpi: 300
    size: [8.0, 4.5]
    font_size: 10
    heatmap_cmap: "RdYlGn"
    heatmap_bounds: [0.0, 0.001, 0.01, 0.05, 0.1, 1.0]
  figure_files:
    overall: "fig_mape_per_model.png"
    horizon: "fig_mape_per_horizon.png"
    boxplot: "fig_mape_per_series_boxplot.png"
    dm_heatmap: "fig_dm_pvalue_heatmap.png"

# Phase 7a — production forecasts to `end_quarter` and long-horizon error per step.
# Same procedure as the Phase 5 main run (refit_statistical = false): Phase 4 artefacts are
# loaded, never retrained, and their state is updated with all actuals up to
# project.last_actual_quarter. Models whose training horizon is shorter (TFT:
# prep.max_prediction_length) are forecast only up to that horizon.
forecast:
  models: ["ets", "arima", "tft", "naive"]
  max_horizon_models: ["tft"]           # limited to prep.max_prediction_length
  end_quarter: "2031Q4"
  backtest_first_split: "val"           # long-horizon origins start at this split ...
  calibration_split: "val"              # ... intervals for the coverage check use these origins
  coverage_split: "test"                # ... and are checked on origins in this split
  interval_level: 0.8                   # central empirical prediction interval
  flat_tolerance: 1.0e-9                # relative range below which a forecast path is flat
  composition_note_drop: 0.1            # report note when MAPE at the last step is >10% below its peak
  n_jobs: 4
  forecast_file: "forecast.parquet"     # in data.processed_dir (series-level, not committed)
  summary_file: "forecast_summary.parquet"
  report_prefix: "phase7"               # aggregate tables in output.reports_dir

# Phase 7b — Streamlit dashboard (local / internal network only; AGENTS.md data rule 6).
# Reads data/processed (panel, forecasts), data/interim (Cost_Model_Desc, ID_lookup) and the
# aggregate reports. Never reads data/raw. No outbound network calls.
dashboard:
  host: "127.0.0.1"
  port: 8501
  gather_usage_stats: false
  title: "Dashboard Pra-Pengadaan: Indeks Biaya Cost Model"
  value_label: "Indeks biaya"
  default_models: ["ets", "arima", "naive"]   # TFT available but off by default (A62)
  default_base_year: 2003
  default_start_year: 2003
  default_concept: null                       # null -> first in alphabetical order
  interval_max_step: 8                        # intervals shown only up to this step (A62)
  error_steps: [1, 4, 8, 23]                  # MAPE columns in the comparison table
  table_decimals: 1
  description_dataset: "Cost_Model_Desc"      # interim parquet stem
  description_id: "ID"
  description_text: "Description"
  lookup_label: "Label"
  lookup_currency: "Local currency"
  colors:
    actual: "#222222"
    qoq: "#9ecae1"
    ets: "#1f77b4"
    arima: "#ff7f0e"
    tft: "#2ca02c"
    naive: "#d62728"
    validated_band: "rgba(44, 160, 44, 0.07)"
    long_band: "rgba(127, 127, 127, 0.07)"
  interval_opacity: 0.15
  chart_height: 520
  model_warnings:
    tft: "TFT hanya dilatih untuk 4 kuartal dan pada data uji meramal jauh di bawah aktual (bias rendah). Gunakan sebagai pembanding, bukan acuan."
    naive: "Naive = nilai aktual terakhir; garis datar ini adalah patokan, bukan ramalan pergerakan."
  source_note: "Sumber data: S&P Global Energy, Market Segment Cost Models Q2 2026. Ramalan: model ETS, ARIMA, TFT, dan naive (tugas akhir). Data aktual sampai 2026Q1; proyeksi S&P tidak ditampilkan."
  license_note: "Data berlisensi dan berhak cipta S&P Global. Hanya untuk penggunaan internal; dilarang menyebarkan, menyalin, atau mempublikasikan."

output:
  models_dir: "models"
  outputs_dir: "outputs"
  reports_dir: "reports"
  eda_dir: "outputs/eda"
  logs_dir: "outputs/logs"
  ets_file: "ets.pkl"
  arima_file: "arima.pkl"
  arima_orders_file: "arima_orders.json"
  tft_file: "tft.ckpt"
  training_summary_file: "training_summary.json"
